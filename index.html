<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Slots — Ставь что угодно</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --panel-color: #1d1836;
            --accent-color: #ff007f;
            --neon-blue: #00f0ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #251c4a 0%, #0f0c1b 100%);
            overflow: hidden;
        }

        .casino-container {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border: 2px solid rgba(255, 0, 127, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        .slots-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 127, 0.2);
        }

        .reel {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 0 15px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s ease;
        }

        .spinning {
            animation: blurSpin 0.1s infinite linear;
        }

        @keyframes blurSpin {
            0% { filter: blur(3px); transform: translateY(-5px); }
            50% { filter: blur(6px); transform: translateY(5px); }
            100% { filter: blur(3px); transform: translateY(-5px); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .spin-btn {
            background: linear-gradient(45deg, var(--accent-color), #ff0055);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 25px;
            font-size: 1.2rem;
            min-height: 60px;
            font-weight: 500;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .lose {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <h1>SLOTS</h1>

        <div class="slots-display">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🍇</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="bet-input">Что вы ставите на кон?</label>
                <input type="text" id="bet-input" placeholder="Например: помыть посуду" maxlength="100">
            </div>
            <button class="spin-btn" id="spin-button" onclick="spin()">Испытать удачу</button>
        </div>

        <div class="message" id="message">Напишите свою ставку и крутите барабан!</div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '💎', '7️⃣'];
        
        const betInput = document.getElementById('bet-input');
        const spinButton = document.getElementById('spin-button');
        const messageEl = document.getElementById('message');
        
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];

        function spin() {
            const betValue = betInput.value.trim();

            if (!betValue) {
                showMessage('Вы ничего не ввели! Напишите ставку.', 'lose');
                return;
            }

            spinButton.disabled = true;
            betInput.disabled = true;
            showMessage('Барабаны крутятся, судьба решается...', '');

            reels.forEach(reel => reel.classList.add('spinning'));

            setTimeout(() => {
                const results = [];
                
                reels.forEach((reel) => {
                    reel.classList.remove('spinning');
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    reel.innerText = randomSymbol;
                    results.push(randomSymbol);
                });

                // Исправленное сравнение элементов внутри массива
                const sym1 = results[0];
                const sym2 = results[1];
                const sym3 = results[2];

                if (sym1 === sym2 && sym2 === sym3) {
                    showMessage(`🎉 ДЖЕКПОТ! Вы сохранили всё и выиграли х3 к ставке: "${betValue}"!`, 'win');
                } else if (sym1 === sym2 || sym2 === sym3 || sym1 === sym3) {
                    showMessage(`👍 Удача на вашей стороне! Ставка "${betValue}" спасена!`, 'win');
                } else {
                    showMessage(`😢 Проигрыш! Вы потеряли: «${betValue}». Придется выполнять!`, 'lose');
                }

                spinButton.disabled = false;
                betInput.disabled = false;

            }, 1200);
        }

        function showMessage(text, className) {
            messageEl.innerText = text;
            messageEl.className = 'message ' + className;
        }
    </script>
</body>
</html>
